<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORKS | AOI OKUBO PORTFOLIO</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ===== WORKS Page Specific ===== */
    .works-section {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 40px 120px;
    }

    .works-title-wrapper {
      text-align: center;
      margin-bottom: 40px;
    }

    /* グリッドレイアウト */
    .works-grid {
      display: grid;
      /* 1つのカードの最小幅を300pxにし、画面に収まらない場合は自動で1列になります */
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
    }

    /* murmur は他カードと同サイズで中央配置 */
    .work-card.center {
      grid-column: 1 / -1;
      width: calc(50% - 12px);
      margin: 0 auto;
    }

    /* カード本体 */
    .work-card {
      display: block;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
    }

    .work-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
    }

    .work-card img {
      width: 100%;
      display: block;
      aspect-ratio: 4 / 3;
      object-fit: cover;
    }

    @media (max-width: 640px) {
      .works-grid {
        grid-template-columns: 1fr;
      }

      .work-card.center {
        width: 100%;
      }

      .works-section {
        padding: 60px 24px 80px;
      }
    }
  </style>
</head>
