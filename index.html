<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOI OKUBO PORTFOLIO</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap">
  <style>
    /* ===== TOP Page Specific ===== */
    body {
      overflow: hidden;
    }

    .hero {
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      user-select: none;
    }

    .hero-name {
      font-family: 'Julius Sans One', sans-serif;
      font-weight: 400;
      font-size: clamp(40px, 5.2vw, 68px);
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: #1a1a1a;
      line-height: 100%;
      margin-bottom: 0;
    }

    .hero-title {
      font-family: 'Julius Sans One', sans-serif;
      font-weight: 700;
      font-size: clamp(40px, 5.2vw, 68px);
      letter-spacing: 0em;
      text-transform: uppercase;
      background: linear-gradient(90deg,rgba(166, 133, 255, 1) 0%, rgba(166, 133, 255, 1) 12%, rgba(255, 255, 255, 1) 19%, rgba(255, 58, 105, 1) 24%, rgba(255, 58, 105, 1) 60%, rgba(255, 255, 255, 1) 63%, rgba(87, 187, 251, 1) 66%, rgba(192, 87, 251, 1) 86%, rgba(166, 133, 255, 1) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 100%;
      margin-bottom: 4px;
    }

    .hero-subtitle {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(12px, 1vw, 16px);
      letter-spacing: 0.01em;
      color: #333333;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">AOI OKUBO</a>
    <nav>
      <a href="index.html" class="active">TOP</a>
      <a href="about.html">ABOUT</a>
      <a href="works.html">WORKS</a>
      <a href="contact.html">CONTACT</a>
    </nav>
    <button class="hamburger" id="hamburger" aria-label="メニューを開く">
      <span></span><span></span><span></span>
    </button>
  </header>

  <nav class="mobile-nav" id="mobile-nav">
    <button class="mobile-nav-close" id="mobile-nav-close" aria-label="閉じる">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/>
      </svg>
    </button>
    <a href="index.html" class="active">TOP</a>
    <a href="about.html">ABOUT</a>
    <a href="works.html">WORKS</a>
    <a href="contact.html">CONTACT</a>
  </nav>

  <main class="hero">
    <p class="hero-name">AOI OKUBO</p>
    <p class="hero-title">PORTFOLIO</p>
    <p class="hero-subtitle">Listen, Think, Shape.</p>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
